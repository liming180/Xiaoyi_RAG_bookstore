services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoyi_rag}
      MYSQL_USER: ${MYSQL_USER:-xiaoyi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  python-ai:
    build:
      context: ../server-ai
      dockerfile: Dockerfile
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', headers={'X-Internal-Token': '${INTERNAL_TOKEN}'})"]
      interval: 5s
      timeout: 3s
      retries: 20

  java-backend:
    build:
      context: ..
      dockerfile: server-java/Dockerfile
    environment:
      AI_SERVICE_URL: http://python-ai:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
      AI_MOCK: "false"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoyi_rag}
      MYSQL_USER: ${MYSQL_USER:-xiaoyi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    ports:
      - "${JAVA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      java-backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql-data:
