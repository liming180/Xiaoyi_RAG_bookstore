worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/json
                      application/javascript application/xml image/svg+xml;

    # 后端地址：容器内用 java-backend，本机直跑用 127.0.0.1:8080
    upstream xiaoyi_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen       8088;
        server_name  _;

        root   html;
        index  index.html;

        # 前端是 SPA，所有未知路径回落到 index.html，否则刷新 /chat 会 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存（文件名带 hash，内容变则名变）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # index.html 不缓存，保证发版后立刻拿到新入口
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 业务 API 反代到 Java 后端
        location /api/ {
            proxy_pass         http://xiaoyi_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 必须清掉 Origin：经过本层反代后浏览器与页面已同源，不需要 CORS。
            # 但 Spring 的 CorsFilter 只要看到 Origin 头就会查白名单，
            # 而白名单里只有 5173/4173，于是 8088 的请求会被判成非法跨域并返回 403
            # （表现就是页面能打开、点登录却报 "Request failed with status code 403"）。
            proxy_set_header   Origin "";
            # SSE 流式问答不能缓冲，且要放宽读超时
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Java 健康检查，方便脚本探测
        # 注意：必须显式覆盖 Host。不给 Host 时 nginx 会填 upstream 名（xiaoyi_backend），
        # 里面的下划线不符合 RFC 7230 的 hostname 规则，Tomcat 会直接回 400。
        location = /healthz {
            proxy_pass         http://xiaoyi_backend/actuator/health;
            proxy_set_header   Host $host;
            access_log         off;
        }
    }
}
