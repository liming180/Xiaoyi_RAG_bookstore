[pytest]
; 根 test/ 是跨端黑盒验收的唯一入口（docs/02-重构设计/04_后端开发提示词.md §2.1）。
; 本文件把 rootdir 固定在 test/，保证 `py -3.12 -X utf8 -m pytest test/J0-contract -q`
; 与 `py -3.12 -X utf8 test/run_all.py` 两条命令行为一致。
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:jsonschema.*
    ignore::DeprecationWarning:referencing.*
markers =
    contract: 契约层用例，只读 docs/api/，不需要运行中的服务
    live: 需要真实 Java / Python 进程
    asyncio: 异步用例（pytest-asyncio, asyncio_mode=auto）
